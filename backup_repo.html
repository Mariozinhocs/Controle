<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repositório de Backups - Controle</title>
    <link rel="icon" type="image/png" href="app_icon.png">
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="stylesheet" href="styles_repo.css">
</head>
<body>

    <div class="repo-container">
        <!-- HEADER DO REPOSITÓRIO -->
        <header class="repo-header">
            <div class="repo-title-group">
                <h1>Repositório de Backups</h1>
                <p>Gerencie as cópias de segurança armazenadas na hospedagem</p>
            </div>
            <button class="btn btn-secondary" id="btn-logout">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: middle;">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
                Sair
            </button>
        </header>

        <!-- SEÇÃO DE TABELA -->
        <main class="table-section">
            <div class="table-title">Arquivos Disponíveis</div>
            
            <div class="table-wrapper">
                <table class="repo-table" id="repo-table" style="display: none;">
                    <thead>
                        <tr>
                            <th>Nome do Arquivo</th>
                            <th>Data de Envio</th>
                            <th>Tamanho</th>
                            <th style="width: 100px; text-align: center;">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <!-- Conteúdo gerado dinamicamente -->
                    </tbody>
                </table>

                <!-- ESTADOS AUXILIARES -->
                <div class="loading-state" id="loading-state">
                    <div class="loading-spinner"></div>
                    <span>Carregando backups...</span>
                </div>

                <div class="empty-state" id="empty-state" style="display: none;">
                    <div class="empty-icon">
                        <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                            <line x1="9" y1="9" x2="15" y2="15"/>
                            <line x1="15" y1="9" x2="9" y2="15"/>
                        </svg>
                    </div>
                    <p>Nenhum arquivo de backup encontrado no servidor.</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Desenvolvido por Mario Henrique (mariozinhocs) - mariozinhocs@gmail.com
        // "si vis pacem para bellum"
        
        // A-Team Protocol: Rastreamento Distribuído (Tracing)
        (function() {
            const originalFetch = window.fetch;
            window.fetch = function(input, init) {
                const traceId = 'trace-' + Date.now() + '-' + Math.random().toString(36).substring(2, 15);
                const correlationId = 'corr-' + Date.now() + '-' + Math.random().toString(36).substring(2, 15);

                let isLocal = false;
                if (typeof input === 'string') {
                    isLocal = !input.startsWith('http://') && !input.startsWith('https://');
                }

                if (isLocal) {
                    init = init || {};
                    init.headers = init.headers || {};
                    if (init.headers instanceof Headers) {
                        init.headers.set('X-Trace-ID', traceId);
                        init.headers.set('X-Correlation-ID', correlationId);
                    } else if (Array.isArray(init.headers)) {
                        init.headers.push(['X-Trace-ID', traceId]);
                        init.headers.push(['X-Correlation-ID', correlationId]);
                    } else {
                        init.headers['X-Trace-ID'] = traceId;
                        init.headers['X-Correlation-ID'] = correlationId;
                    }
                }
                return originalFetch(input, init);
            };
        })();

        document.addEventListener('DOMContentLoaded', () => {
            // Guarda de Rota: Validar se está autenticado
            checkAuthentication();

            // Logout
            document.getElementById('btn-logout').addEventListener('click', () => {
                if (confirm("Deseja realmente encerrar a sessão?")) {
                    localStorage.clear(); // Limpar cache de frotas e cadastros
                    fetch('./api/logout.php', { method: 'POST' })
                        .then(() => {
                            window.location.href = 'backup_login.html';
                        })
                        .catch(() => {
                            window.location.href = 'backup_login.html';
                        });
                }
            });

            function checkAuthentication() {
                fetch('./api/check_auth.php')
                    .then(res => res.json())
                    .then(data => {
                        if (!data.authenticated) {
                            window.location.href = 'backup_login.html';
                        } else {
                            loadBackups();
                        }
                    })
                    .catch(() => {
                        window.location.href = 'backup_login.html';
                    });
            }

            async function loadBackups() {
                const table = document.getElementById('repo-table');
                const tbody = document.getElementById('table-body');
                const loading = document.getElementById('loading-state');
                const empty = document.getElementById('empty-state');

                loading.style.display = 'block';
                table.style.display = 'none';
                empty.style.display = 'none';

                try {
                    const response = await fetch('./api/list_backups.php');
                    if (response.status === 401) {
                        window.location.href = 'backup_login.html';
                        return;
                    }

                    const data = await response.json();
                    loading.style.display = 'none';

                    if (response.ok && data.success && data.backups.length > 0) {
                        tbody.innerHTML = '';
                        
                        data.backups.forEach(file => {
                            const tr = document.createElement('tr');
                            
                            tr.innerHTML = `
                                <td>
                                    <span class="file-name">${file.name}</span>
                                </td>
                                <td>
                                    <span class="file-date">${file.formatted_date}</span>
                                </td>
                                <td>
                                    <span class="file-size">${file.formatted_size}</span>
                                </td>
                                <td class="actions-cell" style="justify-content: center;">
                                    <button class="btn-action btn-action-download" title="Baixar Backup" onclick="downloadFile('${file.name}')">
                                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                            <polyline points="7 10 12 15 17 10"/>
                                            <line x1="12" y1="15" x2="12" y2="3"/>
                                        </svg>
                                    </button>
                                    <button class="btn-action btn-action-delete" title="Excluir Backup" onclick="deleteFile('${file.name}')">
                                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                                            <polyline points="3 6 5 6 21 6"/>
                                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                                            <line x1="10" y1="11" x2="10" y2="17"/>
                                            <line x1="14" y1="11" x2="14" y2="17"/>
                                        </svg>
                                    </button>
                                </td>
                            `;
                            tbody.appendChild(tr);
                        });

                        table.style.display = 'table';
                    } else {
                        empty.style.display = 'flex';
                    }
                } catch (err) {
                    console.error('Erro ao carregar backups:', err);
                    loading.style.display = 'none';
                    empty.style.display = 'flex';
                    empty.querySelector('p').textContent = 'Erro ao carregar arquivos da hospedagem.';
                }
            }

            // Expor globalmente para os botões de ação na tabela
            window.downloadFile = function(filename) {
                // Redireciona de forma segura para o script de download que gerencia as permissões
                window.location.href = `./api/download_backup.php?file=${encodeURIComponent(filename)}`;
            };

            window.deleteFile = async function(filename) {
                if (confirm(`Deseja realmente excluir o backup "${filename}"?\nEsta ação apagará permanentemente o arquivo da hospedagem.`)) {
                    try {
                        const response = await fetch('./api/delete_backup.php', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({ file: filename })
                        });

                        const result = await response.json();
                        if (response.ok && result.success) {
                            alert('Arquivo excluído com sucesso.');
                            loadBackups(); // Recarrega a tabela
                        } else {
                            alert(result.message || 'Falha ao excluir o arquivo.');
                        }
                    } catch (err) {
                        console.error('Erro de exclusão:', err);
                        alert('Erro de conexão ao tentar excluir o arquivo.');
                    }
                }
            };
        });
    </script>
</body>
</html>
